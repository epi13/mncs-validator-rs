name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mncs-rs-v0.2.0-linux-x86_64
            binary: mncs-rs
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mncs-rs-v0.2.0-linux-aarch64
            binary: mncs-rs
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mncs-rs-v0.2.0-macos-arm64
            binary: mncs-rs
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: mncs-rs-v0.2.0-macos-x86_64
            binary: mncs-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mncs-rs-v0.2.0-windows-x86_64
            binary: mncs-rs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "release/${{ matrix.artifact }}${{ matrix.binary == 'mncs-rs.exe' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "mncs-validator-rs v0.2.0 — Independent MNCS Validator" \
            --notes-file RELEASE_NOTES.md
