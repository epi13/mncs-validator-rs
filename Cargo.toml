[package]
name = "mncs-validator-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Independent offline validator for MNCS 0.2"
license = "Apache-2.0"
repository = "https://github.com/epi13/mncs-validator-rs"
keywords = ["mncs", "attestation", "validation", "interoperability"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mncs-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.50", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
walkdir = "2.5.0"
zip = { version = "7.2.0", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
